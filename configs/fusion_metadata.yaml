seed: 42
data:
  ptbxl_dir: data/raw/ptbxl
  train_sites:
  - 1
  test_sites:
  - 2
model:
  signal_embed_dim: 128
  channel_widths:
  - 32
  - 64
  - 128
  - 128
  metadata_embed_dim: 128
  metadata_hidden_dim: 32
  fusion_strategy: concat
  hidden_dim: 64
train:
  batch_size: 32
  epochs: 20
  lr: 0.0005
  weight_decay: 1.0e-05
  num_workers: 2
  validation_fraction: 0.15
modality_dropout:
  enabled: false
  p_drop_signal: 0.0
  p_drop_metadata: 0.0
rare_class:
  name: HYP
  k: 5
output:
  run_dir: experiments/results/fusion_metadata_site1v2
